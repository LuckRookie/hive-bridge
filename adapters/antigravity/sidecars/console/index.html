<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hive Bridge</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <svg class="brand-icon" width="18" height="18" viewBox="0 0 128 128" aria-hidden="true">
            <polygon points="36,36 54,46 54,68 36,78 18,68 18,46" fill="#14B8A6"/>
            <polygon points="92,36 110,46 110,68 92,78 74,68 74,46" fill="#F59E0B"/>
            <polygon points="64,66 82,76 82,98 64,108 46,98 46,76" fill="#64748B"/>
            <path d="M 46 57 Q 64 36 82 57" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          </svg>
          <span class="brand-title">Hive Bridge</span>
        </div>
        <div class="header-controls">
          <select id="host-select" class="select" aria-label="Remote host"></select>
          <span id="status-pill" class="status-pill" title="Remote connectivity">
            <span class="dot"></span><span id="status-text">Connecting</span>
          </span>
          <button id="btn-refresh" type="button" class="icon-btn" title="Refresh now">↻</button>
        </div>
      </div>

      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="board" role="tab" aria-selected="true">
          Board <span id="count-board" class="badge"></span>
        </button>
        <button type="button" class="tab" data-tab="sessions" role="tab" aria-selected="false">
          Codex <span id="count-sessions" class="badge"></span>
        </button>
        <button type="button" class="tab" data-tab="evidence" role="tab" aria-selected="false">
          Evidence <span id="count-runs" class="badge"></span>
        </button>
      </nav>
    </header>

    <div id="empty-config" class="empty hidden">
      <h3>No remote host configured</h3>
      <p>Run <code>./install.sh remote &lt;ssh-host&gt;</code> in your <code>hive-bridge</code> repo to register a remote server.</p>
    </div>

    <main id="content" class="main">
      <!-- Tab 1: Shared Blackboard -->
      <section id="panel-board" class="panel active">
        <div class="toolbar">
          <select id="filter-topic" class="select sm"><option value="">All topics</option></select>
          <select id="filter-to" class="select sm">
            <option value="">All recipients</option>
            <option value="antigravity">to antigravity</option>
            <option value="claude">to claude</option>
            <option value="codex">to codex</option>
            <option value="owner">to owner</option>
            <option value="all">to all</option>
          </select>
          <label class="check"><input id="filter-unread" type="checkbox"> Unread only</label>
        </div>

        <div id="board-error" class="alert hidden"></div>
        <div id="board-list" class="list"></div>

        <form id="board-form" class="composer">
          <div class="composer-row">
            <select id="post-to" class="select sm">
              <option value="all">@all</option>
              <option value="claude">@claude</option>
              <option value="codex">@codex</option>
              <option value="antigravity">@antigravity</option>
            </select>
            <input id="post-topic" class="input sm" type="text" value="general" placeholder="topic">
          </div>
          <div class="composer-row">
            <textarea id="post-text" class="textarea" rows="2" placeholder="Post an instruction or note to the shared board as owner…"></textarea>
            <button type="submit" class="btn primary">Post</button>
          </div>
        </form>
      </section>

      <!-- Tab 2: Remote Codex Sessions & Pinned Slots -->
      <section id="panel-sessions" class="panel">
        <div class="toolbar">
          <input id="filter-cwd" class="input sm grow" type="text" placeholder="Filter by remote project cwd…">
          <button id="btn-gc" type="button" class="btn sm" title="Preview rotated/ephemeral sessions to clean">GC Preview</button>
          <button id="btn-doctor" type="button" class="btn sm">Doctor</button>
        </div>
        <pre id="doctor-out" class="code-box hidden"></pre>
        <div id="gc-box" class="card hidden" style="margin:0 14px 8px;"></div>
        <div id="sessions-error" class="alert hidden"></div>
        <div id="sessions-list" class="list"></div>
      </section>

      <!-- Tab 3: Evidence & Git Diff -->
      <section id="panel-evidence" class="panel">
        <div class="toolbar">
          <input id="diff-cwd" class="input sm grow" type="text" placeholder="Remote git repo path (cwd)…">
          <button id="btn-diff" type="button" class="btn sm">Git Diff</button>
        </div>
        <div id="diff-viewer" class="card hidden"></div>
        <div id="runs-list" class="list"></div>
        <div id="evidence-detail" class="card hidden"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
